<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Счет № {{invoice_id}}</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }
        body {
            font-family: 'DejaVu Sans', 'Roboto', 'Arial', sans-serif;
            font-size: 12pt;
            color: #333;
            line-height: 1.5;
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0;
        }
        .invoice-info {
            margin: 20px 0;
        }
        .invoice-info p {
            margin: 5px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        .total {
            text-align: right;
            font-size: 14pt;
            font-weight: bold;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 10pt;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>СЧЕТ НА ОПЛАТУ</h1>
        <p>Invoice № {{invoice_id}}</p>
    </div>

    <div class="invoice-info">
        <p><strong>Дата:</strong> {{date}}</p>
        <p><strong>Клиент:</strong> {{client}}</p>
        <p><strong>Компания:</strong> {{company}}</p>
        <p><strong>Email:</strong> {{email}}</p>
    </div>

    <div class="invoice-info">
        <p><strong>Описание:</strong> {{description}}</p>
    </div>

    <div class="total">
        <p>Итого к оплате: <strong>{{amount}} {{currency}}</strong></p>
    </div>

    <div class="footer">
        <p>Спасибо за сотрудничество!</p>
    </div>
</body>
</html>
